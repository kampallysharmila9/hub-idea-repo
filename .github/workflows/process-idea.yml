name: Process Idea

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: idea-processing
  cancel-in-progress: false

jobs:

  process-idea:

    if: contains(github.event.issue.labels.*.name, 'idea')

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Scripts:"
          ls -la scripts

          echo ""
          echo "Python files:"
          find . -type f -name "*.py"

- name: Diagnose Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ.get("GEMINI_API_KEY")

          if not key:
              print("ERROR: GEMINI_API_KEY secret is missing.")
              raise SystemExit(1)

          print("API key secret is configured.")
          print("Testing Gemini 2.5 Flash...")

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
          )

          payload = {
              "contents": [{
                  "parts": [{
                      "text": "Reply with exactly OK."
                  }]
              }]
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": key,
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=45
              ) as response:
                  print("HTTP status:", response.status)
                  print("Response:", response.read().decode()[:1500])

          except urllib.error.HTTPError as error:
              print("HTTP status:", error.code)
              print("Response:", error.read().decode()[:1500])

          except Exception as error:
              print("Connection error:", type(error).__name__)
              print(str(error)[:500])
              raise
          PY

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ideas/

          if ! git diff --cached --quiet; then
            git commit -m "Add idea from issue #${{ github.event.issue.number }}"
            git push

          else

            echo "No changes to commit."

          fi
